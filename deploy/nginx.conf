# Placed at /etc/nginx/sites-available/tradingbot and symlinked into sites-enabled.
# Replace YOUR_SSLIP_DOMAIN with e.g. 34-123-45-67.sslip.io (dashes, not dots, for the IP).
# After this is in place, run:
#   sudo certbot --nginx -d YOUR_SSLIP_DOMAIN
# certbot will rewrite this file in place to add the HTTPS server block + redirect.

server {
    listen 80;
    server_name YOUR_SSLIP_DOMAIN;

    # Proxies everything -- the webhook endpoint, the dashboard, /lessons, and
    # the /partials/* endpoints the dashboard polls. FastAPI/Starlette handles
    # routing (and 404s for unknown paths) on the other side.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
