<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Abu Khalid{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="header-title">
      <h1><a href="/"><img src="/static/img/abu_khalid_avatar.png" alt="Abu Khalid" class="brand-avatar" onerror="this.style.display='none'">Abu Khalid</a></h1>
      <nav><a class="accent" href="/lessons">Lessons</a> <a class="accent" href="/backtest">Backtest</a></nav>
    </div>
    <div class="stats" id="stats-container">
      {% include "_stats.html" %}
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
